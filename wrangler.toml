# ---------------------------------------------------------------------------
# Cloudflare Workers configuration for BAM Channel
# ---------------------------------------------------------------------------
name = "bam-channel"
main = "src/channel/deploy/worker/index.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# ── Durable Objects ─────────────────────────────────────────────────────────

[[durable_objects.bindings]]
name = "LARK_CONNECTION"
class_name = "LarkConnection"

[[durable_objects.bindings]]
name = "EXECUTOR_POOL"
class_name = "ExecutorPool"

[[migrations]]
tag = "v1"
new_classes = ["LarkConnection", "ExecutorPool"]

# ── Static environment variables ────────────────────────────────────────────
# Table IDs (tickets, turns, roster, rounds, domains) are loaded at runtime
# from the Configs Bitable table (BITABLE_CONFIGS_TABLE_ID).

[vars]
LARK_APP_ID = ""
BITABLE_APP_TOKEN = ""
BITABLE_CONFIGS_TABLE_ID = ""
OPEN_API_DOMAIN = "open.larksuite.com"

# ── Secrets (set via `wrangler secret put <name>`) ──────────────────────────
#   LARK_APP_SECRET
#   BITABLE_APP_TOKEN   (if not in vars)

# ── Cron trigger — keeps LarkConnection DO alive and auto-reconnects ────────
# Runs every 2 minutes to ensure the Lark event WebSocket stays connected.
[triggers]
crons = ["*/2 * * * *"]

# ── Dev server ──────────────────────────────────────────────────────────────

[dev]
port = 8787
