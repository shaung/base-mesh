# ---------------------------------------------------------------------------
# Cloudflare Workers configuration for BAM Channel
# ---------------------------------------------------------------------------
name = "bam-channel"
main = "src/channel/deploy/worker/index.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# ── Durable Objects ─────────────────────────────────────────────────────────

[[durable_objects.bindings]]
name = "LARK_CONNECTION"
class_name = "LarkConnection"

[[durable_objects.bindings]]
name = "EXECUTOR_POOL"
class_name = "ExecutorPool"

[[migrations]]
tag = "v1"
new_classes = ["LarkConnection", "ExecutorPool"]

# ── Environment variables ───────────────────────────────────────────────────

[vars]
LARK_APP_ID = ""
BITABLE_APP_TOKEN = ""
BITABLE_TICKETS_TABLE_ID = ""
BITABLE_TURNS_TABLE_ID = ""
BITABLE_ROSTER_TABLE_ID = ""
BITABLE_ROUNDS_TABLE_ID = ""
BITABLE_DOMAINS_TABLE_ID = ""
BITABLE_CONFIGS_TABLE_ID = ""
OPEN_API_DOMAIN = "open.larksuite.com"
A2A_API_TOKEN = ""

# ── Secrets (set via `wrangler secret put <name>`) ──────────────────────────
#   LARK_APP_SECRET
#   BITABLE_APP_TOKEN (if overriding vars)

# ── Dev server ──────────────────────────────────────────────────────────────

[dev]
port = 8787
